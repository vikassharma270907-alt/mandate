[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandate-agent"
version = "2.2.0"
description = "Intent-bound purchase agent sandbox prototype for the Airwallex Agentic Banking Hackathon"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mandate prototype" }]
keywords = ["airwallex", "agents", "payments", "policy-engine", "hackathon"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.scripts]
mandate = "mandate.__main__:main"

[tool.setuptools]
packages = ["mandate"]
include-package-data = true

[tool.setuptools.package-data]
mandate = ["static/*.html"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]
